name: Tests

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/badges/coverage.svg'
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=beamz --cov-report=term-missing --cov-report=xml

      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.11'
        run: python scripts/update_coverage_badge.py coverage.xml .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.11'
        run: |
          if git diff --quiet -- .github/badges/coverage.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "ci: update coverage badge"
          git push
